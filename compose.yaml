version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped 
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: team-berners-lee
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./assets/team-berners-lee.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      timeout: 20s
      retries: 10

  # Node.js Application Service
  nodejs:
    build:
      context: .
      dockerfile: Dockerfile.nodejs
    container_name: nodejs-app
    restart: unless-stopped  
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=team-berners-lee
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # Apache/PHP Application Service
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: apache-php-app
    restart: unless-stopped  
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=team-berners-lee
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: