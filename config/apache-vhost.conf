<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Proxy API requests to Node.js container
    ProxyPreserveHost On
    ProxyPass /api http://nodejs:3000/api
    ProxyPassReverse /api http://nodejs:3000/api

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Order allow,deny
        allow from all
        Require all granted
    </Directory>
</VirtualHost>
